name: PR Auto Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show PR information
        run: |
          echo "Base ref: ${{ github.base_ref }}"
          echo "Head ref: ${{ github.head_ref }}"

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}
      - name: Debug refs
        run: |
          echo "github.base_ref=${{ github.base_ref }}"
          echo "github.head_ref=${{ github.head_ref }}"
          echo "event=${{ github.event_name }}"
      - name: Generate report
        run: |
          BASE=${{ github.event.pull_request.base.sha }}

          FILES_CHANGED=$(git diff --name-only $BASE HEAD | wc -l)

          STATS=$(git diff --numstat $BASE HEAD)

          ADDED=$(echo "$STATS" | awk '{sum += $1} END {print sum+0}')
          REMOVED=$(echo "$STATS" | awk '{sum += $2} END {print sum+0}')

          cat > review.md << EOF
          <!-- PR_AUTO_REVIEW -->

          # Automated PR Review

          | Metric | Value |
          |---------|--------|
          | Files Changed | $FILES_CHANGED |
          | Lines Added | $ADDED |
          | Lines Removed | $REMOVED |
          EOF

          cat review.md
      - name: Debug PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("event =", context.eventName);
            console.log("issue =", context.issue);
            console.log("pull_request =", context.payload.pull_request?.number);    
      - name: Create Test Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "✅ PR Auto Review workflow is working"
            });

       
