name: PR Auto Review

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show PR information
        run: |
        echo "Base ref: ${{ github.base_ref }}"
        echo "Head ref: ${{ github.head_ref }}"

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Generate report
        run: |
          BASE=origin/${{ github.base_ref }}

          echo "Using BASE=$BASE"

          FILES_CHANGED=$(git diff --name-only $BASE HEAD | wc -l)

          STATS=$(git diff --numstat $BASE HEAD)

          ADDED=$(echo "$STATS" | awk '{sum += $1} END {print sum+0}')
          REMOVED=$(echo "$STATS" | awk '{sum += $2} END {print sum+0}')

          echo "Files: $FILES_CHANGED"
          echo "Added: $ADDED"
          echo "Removed: $REMOVED"

      - name: Create or Update Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('review.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const existing = comments.data.find(comment =>
              comment.body.includes('<!-- PR_AUTO_REVIEW -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }   
